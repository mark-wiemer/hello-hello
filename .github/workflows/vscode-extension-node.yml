# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: vscode/extension CI (Node.js)

on:
  push:
    branches: ["main"]
    paths:
      - "packages/vscode/extension/**"
      - ".github/workflows/vscode-extension-node.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "packages/vscode/extension/**"
      - ".github/workflows/vscode-extension-node.yml"
  workflow_dispatch:

jobs:
  build:
    env:
      packageDir: packages/vscode/extension
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: packages/vscode/extension/package-lock.json
      - run: npm ci
        working-directory: ${{ env.packageDir }}
      - run: npm run validate:ci
        working-directory: ${{ env.packageDir }}
