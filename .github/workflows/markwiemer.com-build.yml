name: markwiemer.com - Build

on:
  pull_request:
    paths:
      - packages/markwiemer.com/**
  workflow_dispatch:

jobs:
  validate:
    name: validate:ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/markwiemer.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/markwiemer.com/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run validate:ci
        run: npm run validate:ci
