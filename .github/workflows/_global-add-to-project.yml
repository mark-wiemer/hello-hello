# Uses issue context to add the opened issue to the project
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#issues
name: _global - Auto-add issues to project

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # https://github.com/actions/create-github-app-token
      # https://markwiemer.com/software/github/apps/
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: mark-wiemer-org
      # https://github.com/actions/add-to-project
      - uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/orgs/mark-wiemer-org/projects/1
          github-token: ${{ steps.app-token.outputs.token }}
